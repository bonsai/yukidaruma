<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" font-family="'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif">
  <style>
    .box      { fill:#ffffff; stroke:#64748b; stroke-width:1.4; rx:10; }
    .band     { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.2; rx:14; }
    .bandVM   { fill:#eef2ff; stroke:#a5b4fc; stroke-width:1.2; rx:12; }
    .title    { font-size:24px; font-weight:700; fill:#0f172a; }
    .subtitle { font-size:13px; fill:#64748b; }
    .bandname { font-size:13px; font-weight:700; fill:#334155; letter-spacing:.04em; }
    .name     { font-size:14px; font-weight:700; fill:#0f172a; }
    .sub      { font-size:11px; fill:#64748b; }
    .edge     { fill:none; stroke:#94a3b8; stroke-width:1.6; }
    .edgeDash { fill:none; stroke:#b6c2d2; stroke-width:1.6; stroke-dasharray:6 5; }
    .elabel   { font-size:11px; fill:#475569; }
    .chip     { fill:#e2e8f0; stroke:#94a3b8; stroke-width:1; }
    .chipT    { font-size:10px; fill:#334155; font-weight:600; }
    @keyframes chipPulse { 0% {opacity:.30} 7% {opacity:1} 15% {opacity:.30} 100% {opacity:.30} }
    @keyframes chipDone  { 0% {opacity:.30} 7% {opacity:1; fill:#bbf7d0} 15% {opacity:1; fill:#bbf7d0} 90% {opacity:1; fill:#bbf7d0} 100% {opacity:.30} }
    .c1 { animation: chipPulse 12s linear infinite; }
    .c2 { animation: chipPulse 12s linear infinite; animation-delay: 2.4s; }
    .c3 { animation: chipPulse 12s linear infinite; animation-delay: 4.8s; }
    .c4 { animation: chipPulse 12s linear infinite; animation-delay: 7.2s; }
    .c5 { animation: chipDone 12s linear infinite; animation-delay: 9.6s; }
    @keyframes apiGlow { 0%,100% { stroke:#64748b; } 50% { stroke:#2563eb; stroke-width:2.4; } }
    .apiBox { animation: apiGlow 3s ease-in-out infinite; }
    @keyframes softPulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    .adapterLbl { animation: softPulse 4s ease-in-out infinite; }
  </style>

  <!-- ======== Title ======== -->
  <text x="40" y="42" class="title">Yukidaruma — UI/UX &amp; Dataflow</text>
  <text x="40" y="64" class="subtitle">Control plane (Cloudflare) + compute runners (Muse VM first, Colab / Kaggle best-effort) — Journey A: local analysis, looping</text>

  <!-- ======== Actors ======== -->
  <circle cx="95" cy="128" r="17" fill="#fff" stroke="#64748b" stroke-width="1.6"/>
  <path d="M70,168 a25,20 0 0,1 50,0" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <text x="95" y="206" text-anchor="middle" class="name">Human user</text>
  <text x="95" y="222" text-anchor="middle" class="sub">analyst</text>

  <rect x="70" y="262" width="50" height="34" rx="7" fill="#fff" stroke="#64748b" stroke-width="1.6"/>
  <text x="95" y="284" text-anchor="middle" font-size="15">🤖</text>
  <text x="95" y="322" text-anchor="middle" class="name">AI agent</text>
  <text x="95" y="338" text-anchor="middle" class="sub">same authenticated API</text>

  <!-- ======== Client layer band ======== -->
  <rect x="205" y="76" width="275" height="290" class="band"/>
  <text x="225" y="102" class="bandname">CLIENT LAYER</text>

  <rect x="228" y="116" width="230" height="86" class="box"/>
  <text x="343" y="140" text-anchor="middle" class="name">Web UI</text>
  <text x="343" y="160" text-anchor="middle" class="sub">Datasets · SQL Worksheets</text>
  <text x="343" y="177" text-anchor="middle" class="sub">Jobs · Runs · Artifacts · Runners</text>

  <rect x="228" y="248" width="230" height="64" class="box"/>
  <text x="343" y="274" text-anchor="middle" class="name">Agent / CLI client</text>
  <text x="343" y="293" text-anchor="middle" class="sub">submit · poll · fetch results</text>

  <!-- user / agent to clients -->
  <path d="M112,140 C 160,140 180,150 226,152" class="edge"/>
  <path d="M122,282 C 165,282 185,281 226,281" class="edge"/>

  <!-- ======== Control plane band ======== -->
  <rect x="520" y="76" width="380" height="290" class="band"/>
  <text x="540" y="102" class="bandname">CLOUDFLARE EDGE — CONTROL PLANE</text>

  <rect x="560" y="114" width="300" height="66" class="box apiBox"/>
  <text x="710" y="140" text-anchor="middle" class="name">Workers API</text>
  <text x="710" y="160" text-anchor="middle" class="sub">auth · validation · routing · audit</text>

  <!-- D1 cylinder -->
  <path d="M566,238 a54,12 0 0,1 108,0 v44 a54,12 0 0,1 -108,0 z" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
  <ellipse cx="620" cy="238" rx="54" ry="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="620" y="262" text-anchor="middle" class="name">D1</text>
  <text x="620" y="279" text-anchor="middle" class="sub">metadata + job state</text>

  <!-- R2 -->
  <path d="M742,232 h96 l14,14 v44 a6,6 0 0,1 -6,6 h-104 a6,6 0 0,1 -6,-6 v-52 a6,6 0 0,1 6,-6 z" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
  <text x="794" y="260" text-anchor="middle" class="name">R2</text>
  <text x="794" y="277" text-anchor="middle" class="sub">datasets · artifacts</text>

  <!-- job state chips -->
  <g>
    <rect x="540" y="318" width="62" height="20" rx="10" class="chip c1"/><text x="571" y="332" text-anchor="middle" class="chipT">queued</text>
    <rect x="610" y="318" width="62" height="20" rx="10" class="chip c2"/><text x="641" y="332" text-anchor="middle" class="chipT">claimed</text>
    <rect x="680" y="318" width="70" height="20" rx="10" class="chip c3"/><text x="715" y="332" text-anchor="middle" class="chipT">dispatched</text>
    <rect x="758" y="318" width="62" height="20" rx="10" class="chip c4"/><text x="789" y="332" text-anchor="middle" class="chipT">running</text>
    <rect x="828" y="318" width="66" height="20" rx="10" class="chip c5"/><text x="861" y="332" text-anchor="middle" class="chipT">succeeded</text>
  </g>

  <!-- ======== Compute plane band ======== -->
  <rect x="520" y="392" width="660" height="176" class="band"/>
  <text x="540" y="418" class="bandname">COMPUTE PLANE</text>

  <rect x="540" y="428" width="400" height="118" class="bandVM"/>
  <text x="556" y="450" class="bandname">UBUNTU Muse VM — outbound only, no inbound port</text>

  <rect x="556" y="460" width="168" height="56" class="box"/>
  <text x="640" y="483" text-anchor="middle" class="name">Go Orchestrator</text>
  <text x="640" y="500" text-anchor="middle" class="sub">poll · claim · heartbeat</text>

  <rect x="740" y="460" width="150" height="56" class="box"/>
  <text x="815" y="483" text-anchor="middle" class="name">Python Runner</text>
  <text x="815" y="500" text-anchor="middle" class="sub">task execution</text>

  <rect x="640" y="524" width="170" height="0" fill="none"/>
  <text x="815" y="536" text-anchor="middle" class="sub">↓ DuckDB / Polars — local analytics</text>

  <!-- Colab / Kaggle adapters -->
  <path d="M990,470 a26,18 0 0,1 24,-16 a30,20 0 0,1 44,-6 a24,17 0 0,1 30,22 a22,15 0 0,1 -14,26 h-72 a20,15 0 0,1 -12,-26 z" fill="#fff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1036" y="472" text-anchor="middle" class="name">Colab adapter</text>
  <path d="M990,540 a26,18 0 0,1 24,-16 a30,20 0 0,1 44,-6 a24,17 0 0,1 30,22 a22,15 0 0,1 -14,26 h-72 a20,15 0 0,1 -12,-26 z" fill="#fff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1036" y="542" text-anchor="middle" class="name">Kaggle adapter</text>
  <text x="1036" y="590" text-anchor="middle" class="sub adapterLbl">best-effort · manual fallback · later</text>

  <!-- ======== Flow paths (ids used by packets) ======== -->
  <!-- submit: UI -> API -->
  <path id="p_submit" d="M458,146 C 495,146 520,142 558,142" class="edge"/>
  <!-- agent submit: client -> API -->
  <path id="p_agent" d="M458,288 C 505,288 520,190 558,168" class="edge"/>
  <!-- API -> D1 persist -->
  <path id="p_persist" d="M650,180 C 640,200 632,214 626,224" class="edge"/>
  <!-- claim: Orchestrator -> API (poll, around the right side) -->
  <path id="p_claim" d="M724,474 H918 V150 H862" class="edge"/>
  <!-- fetch inputs: R2 -> Runner -->
  <path id="p_fetch" d="M800,296 C 806,350 812,400 814,458" class="edge"/>
  <!-- upload outputs: Runner -> R2 (offset return) -->
  <path id="p_upload" d="M838,458 C 842,400 838,350 824,298" class="edge"/>
  <!-- preview: API -> UI (status + artifact references) -->
  <path id="p_preview" d="M558,128 C 520,124 495,126 460,130" class="edge"/>
  <!-- adapter dispatch: API -> Colab -->
  <path id="p_adapter" d="M862,132 C 950,180 990,300 1018,438" class="edgeDash"/>

  <!-- edge labels -->
  <text x="470" y="112" class="elabel">POST /v1/jobs → 202 + job_id</text>
  <text x="330" y="352" class="elabel">HTTPS + authenticated API</text>
  <text x="560" y="208" class="elabel">persist (state=queued)</text>
  <text x="800" y="392" class="elabel">claim (poll) · heartbeat · events</text>
  <text x="700" y="352" class="elabel">fetch inputs</text>
  <text x="852" y="352" class="elabel">upload logs + outputs + manifest</text>
  <text x="468" y="86" class="elabel">GET status / artifacts → preview (scoped URL)</text>
  <text x="920" y="240" class="elabel">adapter dispatch (best-effort)</text>
  <text x="700" y="200" class="elabel">metadata / object refs</text>
  <path d="M700,180 C 720,200 750,214 772,226" class="edge"/>

  <!-- ======== Animated packets (SMIL) ======== -->
  <circle r="6" fill="#2563eb">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#p_submit" xlink:href="#p_submit"/></animateMotion>
  </circle>
  <circle r="5" fill="#2563eb" opacity=".65">
    <animateMotion dur="7s" begin="2s" repeatCount="indefinite"><mpath href="#p_agent" xlink:href="#p_agent"/></animateMotion>
  </circle>
  <circle r="5" fill="#d97706">
    <animateMotion dur="5s" begin="0.8s" repeatCount="indefinite"><mpath href="#p_persist" xlink:href="#p_persist"/></animateMotion>
  </circle>
  <circle r="6" fill="#7c3aed">
    <animateMotion dur="6s" begin="1.6s" repeatCount="indefinite"><mpath href="#p_claim" xlink:href="#p_claim"/></animateMotion>
  </circle>
  <circle r="6" fill="#0d9488">
    <animateMotion dur="5s" begin="2.6s" repeatCount="indefinite"><mpath href="#p_fetch" xlink:href="#p_fetch"/></animateMotion>
  </circle>
  <circle r="6" fill="#16a34a">
    <animateMotion dur="5s" begin="3.6s" repeatCount="indefinite"><mpath href="#p_upload" xlink:href="#p_upload"/></animateMotion>
  </circle>
  <circle r="5" fill="#16a34a" opacity=".8">
    <animateMotion dur="6s" begin="4.4s" repeatCount="indefinite"><mpath href="#p_preview" xlink:href="#p_preview"/></animateMotion>
  </circle>
  <circle r="5" fill="#94a3b8">
    <animateMotion dur="11s" begin="1s" repeatCount="indefinite"><mpath href="#p_adapter" xlink:href="#p_adapter"/></animateMotion>
  </circle>

  <!-- ======== Bottom: journeys + legend ======== -->
  <rect x="40" y="600" width="1200" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="628" class="name">Journeys</text>
  <text x="60" y="652" font-size="12px" fill="#334155"><tspan font-weight="700" fill="#2563eb">A · First local analysis</tspan> — register dataset → submit job → VM claims → run → preview results (animated above)</text>
  <text x="60" y="674" font-size="12px" fill="#334155"><tspan font-weight="700" fill="#2563eb">B · AI-agent delegation</tspan> — same API: submit → job_id → poll → structured result + artifact refs</text>
  <text x="640" y="652" font-size="12px" fill="#334155"><tspan font-weight="700" fill="#64748b">C · Remote notebook</tspan> — Colab / Kaggle via adapter, best-effort, manual handoff OK</text>
  <text x="640" y="674" font-size="12px" fill="#334155">Packets: <tspan fill="#2563eb">● submit</tspan> <tspan fill="#d97706">● persist</tspan> <tspan fill="#7c3aed">● claim</tspan> <tspan fill="#0d9488">● inputs</tspan> <tspan fill="#16a34a">● results</tspan> <tspan fill="#94a3b8">● adapter</tspan></text>
</svg>
